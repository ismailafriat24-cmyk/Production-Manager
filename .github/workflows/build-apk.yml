name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project Zip
        run: |
          unzip -o Production-Manager.zip -d .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Capacitor
        run: |
          npm install --legacy-peer-deps || npm install
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/android

      - name: Initialize & Sync Capacitor
        run: |
          npx cap init "ProductionManager" "com.productionmanager.app" --web-dir dist || npx cap init "ProductionManager" "com.productionmanager.app" --web-dir public || npx cap init "ProductionManager" "com.productionmanager.app" --web-dir build
          npx cap add android
          npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
